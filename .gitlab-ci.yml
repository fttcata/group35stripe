# GitLab CI/CD configuration
stages:
  - test
  - build
  - quality

# Lint job
lint:
  stage: test
  script:
    - npm ci --legacy-peer-deps
    - npm run lint
  cache:
    key: ${CI_COMMIT_REF_SLUG}-protected
    paths:
      - node_modules/
      - .next/cache/

# Typecheck job
typecheck:
  stage: test
  script:
    - npm ci --legacy-peer-deps
    - npm run typecheck
  cache:
    key: ${CI_COMMIT_REF_SLUG}-protected
    paths:
      - node_modules/
      - .next/cache/

# Build job
build:
  stage: build
  script:
    - npm ci --legacy-peer-deps
    - STRIPE_SECRET_KEY=sk_test_placeholder NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 day
  cache:
    key: ${CI_COMMIT_REF_SLUG}-protected
    paths:
      - node_modules/
      - .next/cache/

# Environment variable check
env-check:
  stage: quality
  script:
    - |
      echo "Checking for hardcoded secrets..."
      if grep -r "sk_live_" app/ lib/ --exclude-dir=node_modules || 
         grep -r "pk_live_" app/ lib/ --exclude-dir=node_modules; then
        echo "ERROR: Found potential hardcoded Stripe live keys!"
        exit 1
      fi
      echo "No hardcoded live keys found."
  allow_failure: false

# Build size check
build-size-check:
  stage: quality
  dependencies:
    - build
  script:
    - |
      echo "Checking build output size..."
      BUILD_SIZE=$(du -sh .next | cut -f1)
      echo "Build size: $BUILD_SIZE"
      # This is informational for now
  allow_failure: true
  artifacts:
    paths:
      - .next/

# Package.json validation
package-validation:
  stage: quality
  script:
    - npm ci --legacy-peer-deps
    - |
      echo "Validating package.json structure..."
      node -e "const pkg = require('./package.json'); 
      if (!pkg.name || !pkg.version || !pkg.scripts || !pkg.dependencies) {
        console.error('Invalid package.json structure');
        process.exit(1);
      }
      console.log('package.json is valid');"
  cache:
    key: ${CI_COMMIT_REF_SLUG}-protected
    paths:
      - node_modules/

# Merge conflict marker check
merge-conflict-check:
  stage: test
  script:
    - |
      echo "Checking for unresolved merge conflict markers..."
      if grep -R -nE '^(<<<<<<<|=======|>>>>>>>)' \
        --exclude-dir=.git \
        --exclude-dir=node_modules \
        --exclude-dir=.next \
        .; then
        echo "ERROR: Unresolved merge conflict markers found."
        exit 1
      fi
      echo "No merge conflict markers found."

# Required file presence smoke check
required-files-check:
  stage: test
  script:
    - |
      echo "Checking required project files..."
      required_files="
      package.json
      package-lock.json
      next.config.ts
      tsconfig.json
      app/api/checkout/route.ts
      app/api/events/route.ts
      app/api/tickets/route.ts
      app/api/webhooks/stripe/route.ts
      "
      for file in $required_files; do
        if [ ! -f "$file" ]; then
          echo "ERROR: Missing required file: $file"
          exit 1
        fi
      done
      echo "All required project files are present."

# Environment template smoke check
env-template-check:
  stage: quality
  script:
    - |
      echo "Checking .env.example for required keys..."
      test -f .env.example || { echo "ERROR: .env.example is missing"; exit 1; }
      required_keys="NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_BASE_URL"
      for key in $required_keys; do
        if ! grep -q "^${key}=" .env.example; then
          echo "ERROR: Missing $key in .env.example"
          exit 1
        fi
      done
      echo ".env.example contains all required keys."

# Database file presence smoke check
db-files-check:
  stage: quality
  script:
    - |
      echo "Checking database SQL files..."
      db_files="db/schema.sql db/seeds.sql db/profiles.sql db/guest_checkout.sql"
      for file in $db_files; do
        if [ ! -f "$file" ]; then
          echo "ERROR: Missing database file: $file"
          exit 1
        fi
      done
      echo "All expected database files are present."

# Security audit - fail on high or critical npm vulnerabilities
security-audit:
  stage: quality
  script:
    - npm ci --legacy-peer-deps
    - |
      echo "Running npm security audit..."
      npm audit --audit-level=high --omit=dev
  cache:
    key: ${CI_COMMIT_REF_SLUG}-protected
    paths:
      - node_modules/
  allow_failure: false

# Console.log check - no debug logs left in source files
console-log-check:
  stage: test
  script:
    - |
      echo "Checking for leftover console.log statements in source files..."
      if grep -rn "console\.log" app/ lib/ --include="*.ts" --include="*.tsx" \
        --exclude-dir=node_modules; then
        echo "ERROR: console.log statements found in source. Remove or replace with proper logging."
        exit 1
      fi
      echo "No console.log statements found."

# API route HTTP method export check
api-route-method-check:
  stage: test
  script:
    - |
      echo "Checking that API route files export at least one HTTP method handler..."
      failed=0
      for file in $(find app/api -name "route.ts" 2>/dev/null); do
        if ! grep -qE "^export (async )?function (GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)" "$file"; then
          echo "ERROR: $file does not export a recognised HTTP method handler"
          failed=1
        fi
      done
      if [ "$failed" -eq 1 ]; then exit 1; fi
      echo "All API route files export at least one HTTP method handler."

# Stripe webhook signature verification check
stripe-webhook-check:
  stage: test
  script:
    - |
      echo "Verifying Stripe webhook route validates Stripe-Signature header..."
      webhook_file="app/api/webhooks/stripe/route.ts"
      if [ ! -f "$webhook_file" ]; then
        echo "ERROR: Stripe webhook route not found at $webhook_file"
        exit 1
      fi
      if ! grep -q "stripe-signature\|Stripe-Signature\|constructEvent\|constructEventAsync" "$webhook_file"; then
        echo "ERROR: Webhook route does not appear to verify the Stripe-Signature header."
        exit 1
      fi
      echo "Stripe webhook signature verification is present."

# Environment variable reference check
# Ensures every process.env key used in source is documented in .env.example
env-var-reference-check:
  stage: quality
  script:
    - |
      echo "Cross-checking process.env references against .env.example..."
      missing=0
      while IFS= read -r key; do
        if ! grep -q "^${key}=" .env.example 2>/dev/null; then
          echo "WARNING: $key is used in source but not documented in .env.example"
          missing=1
        fi
      done < <(grep -rhoP '(?<=process\.env\.)\w+' app/ lib/ middleware.ts 2>/dev/null | sort -u)
      if [ "$missing" -eq 1 ]; then
        echo "ERROR: Some environment variables are undocumented. Add them to .env.example."
        exit 1
      fi
      echo "All process.env references are documented in .env.example."
